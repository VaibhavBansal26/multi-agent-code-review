## Render Blueprint — MACRV Multi-Agent Code Review
## Deploy: https://dashboard.render.com/blueprints → "New Blueprint Instance"
## Repo: https://github.com/VaibhavBansal26/multi-agent-code-review
##
## DATABASE: Uses an external Postgres (Neon / Supabase / Railway).
## After blueprint deploy, set DATABASE_URL and DATABASE_URL_SYNC in
## the Render dashboard → macrv-api → Environment (and macrv-worker).
## config.py auto-converts postgresql:// → postgresql+asyncpg:// for the API.

services:
  # ── Redis (Celery broker + result backend) ─────────────────────────────────
  - type: keyvalue
    name: macrv-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []   # private — only accessible within Render private network

  # ── FastAPI web service ────────────────────────────────────────────────────
  - type: web
    name: macrv-api
    runtime: python
    region: oregon
    plan: free
    branch: claude/sweet-brown-bkbjnh
    repo: https://github.com/VaibhavBansal26/multi-agent-code-review
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        sync: false   # paste your Neon/Supabase postgresql:// URL here
      - key: DATABASE_URL_SYNC
        sync: false   # same URL — config.py keeps the right scheme for each
      - key: CELERY_BROKER_URL
        fromService:
          name: macrv-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: macrv-redis
          type: keyvalue
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: APP_ENV
        value: production

  # ── Celery worker ──────────────────────────────────────────────────────────
  - type: worker
    name: macrv-worker
    runtime: python
    region: oregon
    plan: free
    branch: claude/sweet-brown-bkbjnh
    repo: https://github.com/VaibhavBansal26/multi-agent-code-review
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.queue.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: macrv-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: macrv-redis
          type: keyvalue
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: APP_ENV
        value: production
