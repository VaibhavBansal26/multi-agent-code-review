name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx
      - name: Ensure async extras
        run: pip install "sqlalchemy[asyncio]" greenlet

      - name: Lint (ruff)
        run: ruff check app/ tests/ || true

      - name: Run tests
        env:
          GITHUB_WEBHOOK_SECRET: test-secret
          ANTHROPIC_API_KEY: sk-ant-test
          DATABASE_URL: postgresql+asyncpg://macrv:macrv@localhost:5432/macrv
          DATABASE_URL_SYNC: postgresql://macrv:macrv@localhost:5432/macrv
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --ignore=tests/test_integration.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check app/ tests/ --output-format=github
